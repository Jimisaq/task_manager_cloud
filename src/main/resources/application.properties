spring.application.name=task_manager_cloud_assignment

server.port=${PORT:8181}

# Basic datasource config - will be overridden by DataSourceConfig
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.server.port=${PORT:8080}

# Logging Configuration
logging.level.org.springframework.web=DEBUG
logging.level.org.jimisaac.task_manager_cloud_assignment=DEBUG
logging.level.org.springframework.web.cors=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# HTTP Method Override Configuration
# Ensure POST/PUT/DELETE methods are not overridden
spring.mvc.hiddenmethod.filter.enabled=false
